# Optional. Use "sendgrid" or "resend" for HTTPS API delivery, or "smtp" for classic SMTP.
mail_provider = "sendgrid"

[sendgrid]
# Recommended when SMTP is blocked and you do not own a custom domain.
# Verify a single sender in SendGrid, then create an API key.
api_key = "SG.xxxxxxxxx"
from_email = "your_verified_sender@example.com"
from_name = "CampusMate"

[resend]
# Recommended for Streamlit Cloud because it uses HTTPS instead of SMTP ports.
# Create an API key at https://resend.com/api-keys and verify a sender/domain.
api_key = "re_xxxxxxxxx"
from_email = "CampusMate <onboarding@resend.dev>"

[smtp]
# Common examples:
# - QQ Mail: host = "smtp.qq.com", port = 465, use_tls = false, use_ssl = true
# - 163 Mail: host = "smtp.163.com", port = 465, use_tls = false, use_ssl = true
# - Gmail: host = "smtp.gmail.com", port = 587, use_tls = true, use_ssl = false
# Use an SMTP authorization code or app password, not your normal mailbox password.
host = "smtp.example.com"
port = 587
username = "your_sender@example.com"
password = "your_smtp_password_or_app_password"
from_email = "CampusMate <your_sender@example.com>"
use_tls = true
use_ssl = false
