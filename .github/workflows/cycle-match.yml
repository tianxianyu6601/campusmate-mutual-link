name: Weekly cycle matching

on:
  schedule:
    # 11:00 UTC = Sunday 19:00 Asia/Shanghai.
    - cron: "0 11 * * 0"
  workflow_dispatch:

concurrency:
  group: campusmate-cycle-match
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CAMPUSMATE_DATABASE_URL: ${{ secrets.CAMPUSMATE_DATABASE_URL }}
      CAMPUSMATE_SENDGRID_API_KEY: ${{ secrets.CAMPUSMATE_SENDGRID_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check database secret
        shell: bash
        run: |
          if [ -z "$CAMPUSMATE_DATABASE_URL" ]; then
            echo "::error::Please add the repository secret CAMPUSMATE_DATABASE_URL."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Finalize overdue round and open the next one
        run: python scripts/cycle_match_worker.py
